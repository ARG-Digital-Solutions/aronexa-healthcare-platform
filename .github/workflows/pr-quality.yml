name: PR Quality Gates
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 00 core documents
        run: python3 scripts/ci/check_docs.py
  scope:
    name: PR scope and dangerous-file checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD > /tmp/changed-files.txt
          fi
          python3 scripts/ci/check_scope.py /tmp/changed-files.txt
  secrets:
    name: Tracked secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked source
        run: python3 scripts/ci/check_secrets.py
  application:
    permissions:
      contents: write
    name: Application CI (when scaffold exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine application presence
        id: presence
        shell: bash
        run: |
          if [ -f backend/pom.xml ] && [ -f frontend/package.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Application scaffold absent: backend/frontend build NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v4
        if: steps.presence.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        if: steps.presence.outputs.enabled == 'true'
        with:
          node-version: '22'
      - name: Backend build and architecture tests
        if: steps.presence.outputs.enabled == 'true'
        run: mvn -B -f backend/pom.xml verify
      - name: Frontend build and initial lockfile generation
        if: steps.presence.outputs.enabled == 'true'
        working-directory: frontend
        run: |
          if [ ! -f package-lock.json ]; then
            echo 'P01-T01: generating first lockfile for review; commit it before merge'
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund
          npm run build
      - name: One-time lockfile commit on corrective branch
        if: steps.presence.outputs.enabled == 'true' && github.event_name == 'pull_request' && github.head_ref == 'fix/p01-t01-frontend-lockfile'
        shell: bash
        run: |
          if ! git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "fix(p01-t01): commit npm dependency lockfile"
            git push origin HEAD:fix/p01-t01-frontend-lockfile
          fi
      - name: Upload generated lockfile for P01-T01 correction
        if: steps.presence.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: error
