name: PR Quality Gates
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 00 core documents
        run: python3 scripts/ci/check_docs.py
  scope:
    name: PR scope and dangerous-file checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD > /tmp/changed-files.txt
          fi
          python3 scripts/ci/check_scope.py /tmp/changed-files.txt
  secrets:
    name: Tracked secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked source
        run: python3 scripts/ci/check_secrets.py
  application:
    name: Application CI (when scaffold exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine application presence
        id: presence
        shell: bash
        run: |
          if [ -f backend/pom.xml ] && [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Complete application scaffold absent: backend/frontend build NOT RUN; partial scaffold requires separate verification" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v4
        if: steps.presence.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        if: steps.presence.outputs.enabled == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend build and unit/integration tests
        if: steps.presence.outputs.enabled == 'true'
        run: mvn -B -f backend/pom.xml verify
      - name: Frontend build
        if: steps.presence.outputs.enabled == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
