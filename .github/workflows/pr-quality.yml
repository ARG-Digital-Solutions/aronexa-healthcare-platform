name: PR Quality Gates
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Phase 00 core documents
        run: python3 scripts/ci/check_docs.py
  scope:
    name: PR scope and dangerous-file checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD > /tmp/changed-files.txt
          fi
          python3 scripts/ci/check_scope.py /tmp/changed-files.txt
  secrets:
    name: Tracked secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked source
        run: python3 scripts/ci/check_secrets.py
  application:
    name: Application CI (when scaffold exists)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine application presence
        id: presence
        shell: bash
        run: |
          if [ -f backend/pom.xml ] && [ -f frontend/package.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Application scaffold absent: backend/frontend build NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v4
        if: steps.presence.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        if: steps.presence.outputs.enabled == 'true'
        with:
          node-version: '22'
      - name: Validate local development Docker Compose syntax
        if: steps.presence.outputs.enabled == 'true'
        env:
          ARONEXA_DB_PASSWORD: ci-config-validation-placeholder
          ARONEXA_RUNTIME_DB_PASSWORD: ci-config-runtime-placeholder
          ARONEXA_AUTH_DB_PASSWORD: ci-config-auth-placeholder
          ARONEXA_PATIENT_DB_PASSWORD: ci-config-patient-placeholder
        run: docker compose -f deploy/dev/compose.yml config --quiet
      - name: Verify Docker runtime for PostgreSQL integration tests
        if: steps.presence.outputs.enabled == 'true'
        run: docker info
      - name: Backend build, Flyway and PostgreSQL Testcontainers integration tests
        if: steps.presence.outputs.enabled == 'true'
        run: mvn -B -f backend/pom.xml verify
      - name: Frontend reproducible build
        if: steps.presence.outputs.enabled == 'true'
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  # C2-S2-C9: dependency metadata only. OSV queries public vulnerability
  # services; no patient data or production credentials are supplied.
  osv-dependency-review:
    name: OSV dependency vulnerabilities (Maven and npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan pinned Maven and npm manifests using read-only OSV container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,source=${PWD},target=/src,readonly" \
            ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 \
            scan source --recursive /src/backend /src/frontend

  npm-dependency-audit:
    name: npm locked dependencies (high and critical)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit npm lockfile without modifying dependencies
        working-directory: frontend
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/
