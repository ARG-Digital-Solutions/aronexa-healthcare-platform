name: Validate Central QA Product Handoff
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/central-qa-handoff.yml'
      - '.github/workflows/central-qa-lint.yml'
      - '.github/QA_CENTRAL_HANDOFF.md'

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint privileged handoff without secrets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Statically inspect handoff event security and YAML syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= \
            .github/workflows/central-qa-handoff.yml \
            .github/workflows/central-qa-lint.yml
